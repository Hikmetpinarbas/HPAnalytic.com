<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPAnalytic · Pas Ağı</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#08090B; color:#F4F2EC; font-family:'JetBrains Mono',monospace; padding:32px 20px 80px; }
  .wrap { max-width:1100px; margin:0 auto; }
  .kicker { color:#B4FF39; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:12px; }
  h1 { font-family:'Newsreader',serif; font-weight:400; font-size:32px; margin:0 0 12px; letter-spacing:-0.01em; }
  .sub { color:rgba(244,242,236,0.5); font-size:13px; margin:0 0 32px; line-height:1.7; max-width:700px; }
  #pn-root { margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">HPAnalytic · Pas Örgüsü</div>
  <h1>Top nereden nereye dönüyor?</h1>
  <p class="sub" id="pn-meta">Yükleniyor…</p>
  <div style="margin: 16px 0 8px; display: flex; gap: 12px; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 12px;">
    <label style="color: #B4FF39;">MAÇ:</label>
    <select id="match-selector" onchange="location.href='?match='+this.value" style="background: #08090B; color: #F4F2EC; border: 1px solid #FF6B35; padding: 6px 10px; font-family: inherit; font-size: 12px; cursor: pointer;">
      <option value="gs-stuttgart">Stuttgart — Galatasaray (03.11)</option>
      <option value="gs-fener">Galatasaray — Fenerbahçe (26.10)</option>
      <option value="scp-gs">Sporting — Galatasaray (09.09)</option>
    </select>
  </div>
  <div id="pn-root"></div>
</div>
<script type="module">
  import { initPassNetwork } from '/src/js/viz/pass-network.js';
  const params = new URLSearchParams(location.search);
  const slug = params.get('match') || 'gs-stuttgart';
  const dataUrl = `/assets/data/${slug}/pass_network_v2.json`;
  const sel = document.getElementById('match-selector');
  if (sel) sel.value = slug;
  initPassNetwork(document.getElementById('pn-root'), { dataUrl, slug });
</script>
</body>
</html>
