<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .bg-void { fill: #121518; }
      .grid-line { stroke: rgba(235, 238, 242, 0.12); stroke-width: 0.75; }
      .fourier-1 { stroke: #3A86C8; stroke-width: 2.5; fill: none; }
      .fourier-2 { stroke: #E5A93C; stroke-width: 1.5; stroke-dasharray: 4, 4; fill: none; }
      .harmonic { stroke: rgba(235, 238, 242, 0.3); stroke-width: 1; fill: none; }
      .text-title { font-family: 'Newsreader', serif; fill: #F8FAFC; font-size: 20px; font-weight: 700; }
      .text-meta { font-family: 'IBM Plex Mono', monospace; fill: #94A3B8; font-size: 11px; letter-spacing: 0.15em; }
      .text-amber { font-family: 'IBM Plex Mono', monospace; fill: #E5A93C; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="675" class="bg-void" />
  <!-- Koordinat Eksenleri -->
  <g class="grid-line">
    <line x1="120" y1="337" x2="1080" y2="337" stroke="rgba(235, 238, 242, 0.3)" stroke-width="1.5" />
    <line x1="560" y1="120" x2="560" y2="550" stroke-dasharray="3, 3" />
    <circle cx="560" cy="337" r="160" fill="none" />
    <circle cx="560" cy="337" r="80" fill="none" stroke-dasharray="2, 6" />
  </g>
  <!-- Neredeyse Periyodik Fonksiyonlar (Fourier Harmonikleri) -->
  <path d="M 120,337 Q 230,160 340,337 T 560,337 T 780,337 T 1000,337" class="fourier-1" />
  <path d="M 120,337 Q 175,240 230,337 T 340,337 T 450,337 T 560,337 T 670,337 T 780,337 T 890,337 T 1000,337" class="fourier-2" />
  <!-- "La Pausa" Durgunluk Fazı (Singularity) -->
  <circle cx="560" cy="337" r="10" fill="#E5A93C" />
  <line x1="560" y1="210" x2="560" y2="465" stroke="#E5A93C" stroke-width="2" />
  <rect x="470" y="160" width="180" height="45" fill="#181D22" stroke="#242E38" rx="3" />
  <text x="485" y="188" class="text-amber" font-size="12">LA PAUSA (v = 0, a = max)</text>
  <!-- Tufte Notu -->
  <rect x="780" y="420" width="280" height="110" fill="#181D22" stroke="#242E38" rx="4" />
  <text x="800" y="445" class="text-title" font-size="13">Harald Bohr Teoremi</text>
  <text x="800" y="470" fill="#CBD5E1" font-size="11">Dinamik Alanın Neredeyse Periyodikliği</text>
  <text x="800" y="495" fill="#3A86C8" font-family="'IBM Plex Mono', monospace" font-size="10">f(t + τ) ≈ f(t) [Faz Kilidi Sönümü]</text>
  <!-- Başlık -->
  <text x="80" y="52" class="text-title">HPANALYTIC · HARALD BOHR: SAHADAN MATEMATİĞE</text>
  <text x="80" y="70" class="text-meta">PERIODIC SPATIAL ATTRACTORS · FOURIER HARMONICS · ATLAS 07</text>
  <text x="80" y="630" class="text-meta">EVENT ⊂ ZFGV · TENEBRIST CANVAS 1200x675</text>
</svg>