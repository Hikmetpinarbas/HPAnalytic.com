<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>

    <radialGradient id="chiaroscuroBeam" cx="82%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.32" />
      <stop offset="42%" stop-color="#E5A93C" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#121518" stop-opacity="0" />
    </radialGradient>

    <style>
      .bg-void { fill: #121518; }
      .grid-davinci davinci-grid { stroke: rgba(235, 238, 242, 0.12); stroke-width: 0.75; fill: none; }
      .zone14-box { fill: rgba(229, 169, 60, 0.08); stroke: #E5A93C; stroke-width: 1.5; stroke-dasharray: 4, 3; }
      .pass-cobalt { stroke: #3A86C8; stroke-width: 3; stroke-linecap: round; fill: none; }
      .pressure-amber { stroke: #E5A93C; stroke-width: 2.5; stroke-dasharray: 5, 4; fill: none; }
      .text-title { font-family: 'Newsreader', serif; fill: #F8FAFC; font-size: 20px; font-weight: 700; }
      .text-meta { font-family: 'IBM Plex Mono', monospace; fill: #94A3B8; font-size: 11px; letter-spacing: 0.15em; }
      .text-amber { font-family: 'IBM Plex Mono', monospace; fill: #E5A93C; font-weight: 700; }
      .text-cobalt { font-family: 'IBM Plex Mono', monospace; fill: #3A86C8; font-weight: 700; }
    
    @keyframes teslaFlow {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseEvidence {
      0% { r: 6px; opacity: 0.8; }
      50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 6px #E5A93C); }
      100% { r: 6px; opacity: 0.8; }
    }
    @keyframes pulseEmerald {
      0% { r: 7px; filter: drop-shadow(0 0 2px #00E676); }
      50% { r: 10px; filter: drop-shadow(0 0 8px #00E676); }
      100% { r: 7px; filter: drop-shadow(0 0 2px #00E676); }
    }
    .tesla-flow {
      stroke-dasharray: 6 4 !important;
      animation: teslaFlow 1.8s linear infinite !important;
    }
    .pulse-amber {
      animation: pulseEvidence 2.2s ease-in-out infinite !important;
      transform-origin: center;
    }
    .pulse-emerald {
      animation: pulseEmerald 2s ease-in-out infinite !important;
      transform-origin: center;
    }
    .chiaroscuro-cone {
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .davinci-grid {
      stroke: rgba(235, 238, 242, 0.08) !important;
      stroke-width: 0.6px !important;
    }

    </style>
  </defs>
  <rect width="1200" height="675" class="bg-void" />
  <!-- Da Vinci 18 Bölgeli Izgara -->
  <g class="grid-davinci davinci-grid">
    <rect x="140" y="95" width="920" height="480" stroke="rgba(235, 238, 242, 0.22)" stroke-width="1.2" />
    <line x1="446" y1="95" x2="446" y2="575" />
    <line x1="753" y1="95" x2="753" y2="575" />
    <line x1="140" y1="215" x2="1060" y2="215" />
    <line x1="140" y1="455" x2="1060" y2="455" />
    <line x1="600" y1="95" x2="600" y2="575" stroke-dasharray="3, 3" />
    <circle cx="600" cy="335" r="75" />
  </g>
  <!-- Zone 14 Karar Alanı -->
  <rect x="630" y="215" width="123" height="240" class="zone14-box" />
  <text x="645" y="240" class="text-amber" font-size="12">ZONE 14 (xT &gt; 0.14)</text>
  <!-- Dikine Pas Vektörü (Kobalt Akış) -->
  <path d="M 380,480 Q 520,440 680,335" class=\"pass-cobalt tesla-flow\" />
  <polygon points="685,330 670,335 678,348" fill="#3A86C8" />
  <circle cx="380" cy="480" r="7" fill="#3A86C8" />
  <text x="310" y="505" class="text-cobalt" font-size="12">İlerletici Hat Kırıcı Pas</text>
  <!-- Stoper Temas Momenti & Karşıt Baskı (Amber) -->
  <circle cx="690" cy="330" r="8" fill="#E5A93C" / class=\"pulse-amber\">
  <circle cx="715" cy="318" r="8" fill="#BE7A37" />
  <path d="M 735,310 Q 705,320 685,325" class="pressure-amber" />
  <text x="735" y="300" class="text-amber" font-size="12">Fiziksel Tork / Kör Nokta Baskısı</text>
  <!-- Analitik Panel -->
  <rect x="800" y="380" width="240" height="150" fill="#181D22" stroke="#242E38" rx="4" />
  <text x="815" y="405" class="text-title" font-size="14">Epistemik Ayrım</text>
  <text x="815" y="430" fill="#CBD5E1" font-size="12">xG Modeli: Kör Açıda 0.08</text>
  <text x="815" y="455" class="text-amber" font-size="12">xT Katkısı: +0.22 (Bölge Kazanımı)</text>
  <text x="815" y="480" class="text-cobalt" font-size="11">EPV Delta: Pozitif Alan İşgali</text>
  <text x="815" y="505" fill="#94A3B8" font-size="10">Karar: Sinyal ≠ Kanıt</text>
  <!-- Başlık -->
  <text x="80" y="52" class="text-title">HPANALYTIC · HALKIN METRİKLERİ VE EPİSTEMİK CEPHELER</text>
  <text x="80" y="70" class="text-meta">EPISTEMOLOGY OF METRICS · ZONE 14 EXPLOITATION · ATLAS 05</text>
  <text x="80" y="630" class="text-meta">EVENT ⊂ ZFGV · TENEBRIST CANVAS 1200x675</text>
</svg>