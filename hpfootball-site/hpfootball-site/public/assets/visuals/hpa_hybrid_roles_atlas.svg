<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .bg-void { fill: #121518; }
      .pitch-line { stroke: rgba(235, 238, 242, 0.22); stroke-width: 1.5; fill: none; }
      .zone-box { fill: rgba(229, 169, 60, 0.12); stroke: #E5A93C; stroke-width: 1.5; stroke-dasharray: 4, 3; }
      .vector-cobalt { stroke: #3A86C8; stroke-width: 3.5; stroke-linecap: round; fill: none; }
      .text-title { font-family: 'Newsreader', serif; fill: #F8FAFC; font-size: 20px; font-weight: 700; }
      .text-sub { font-family: 'IBM Plex Mono', monospace; fill: #94A3B8; font-size: 11px; }
      .text-amber { font-family: 'IBM Plex Mono', monospace; fill: #E5A93C; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="675" class="bg-void" />
  <rect x="120" y="90" width="960" height="495" class="pitch-line" />
  <line x1="600" y1="90" x2="600" y2="585" class="pitch-line" />
  <circle cx="600" cy="337.5" r="75" class="pitch-line" />
  <rect x="740" y="210" width="140" height="255" class="zone-box" />
  <text x="765" y="340" class="text-amber" font-size="14">ZONE 14</text>
  <!-- Inverted Fullback Akışı -->
  <path d="M 350,500 Q 450,490 520,380" class="vector-cobalt" />
  <circle cx="350" cy="500" r="7" fill="#3A86C8" />
  <text x="220" y="525" fill="#F8FAFC" font-size="13" font-family="'Geist', sans-serif">INVERTED FULLBACK</text>
  <!-- Raumdeuter Kör Noktası -->
  <circle cx="920" cy="180" r="9" fill="#E5A93C" stroke="#121518" stroke-width="2" />
  <text x="860" y="160" class="text-amber" font-size="12">RAUMDEUTER (Kör Nokta)</text>
  <text x="120" y="55" class="text-title">HPANALYTIC · HİBRİT ROLLER VE ALAN HACMİ</text>
  <text x="1080" y="625" text-anchor="end" class="text-sub">EVENT ⊂ ZFGV · CARAVAGGIO ATLAS 03</text>
</svg>