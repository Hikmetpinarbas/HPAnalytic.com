<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>

    <radialGradient id="chiaroscuroBeam" cx="82%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.32" />
      <stop offset="42%" stop-color="#E5A93C" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#121518" stop-opacity="0" />
    </radialGradient>

    <style>
      .bg-void { fill: #121518; }
      .seal-davinci { stroke: rgba(229, 169, 60, 0.35); stroke-width: 1.2; fill: none; }
      .field-tesla { stroke: #3A86C8; stroke-width: 1.5; stroke-dasharray: 6, 4; fill: none; }
      .text-serif { font-family: 'Newsreader', serif; fill: #F8FAFC; }
      .text-mono { font-family: 'IBM Plex Mono', monospace; }
    
    @keyframes teslaFlow {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseEvidence {
      0% { r: 6px; opacity: 0.8; }
      50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 6px #E5A93C); }
      100% { r: 6px; opacity: 0.8; }
    }
    @keyframes pulseEmerald {
      0% { r: 7px; filter: drop-shadow(0 0 2px #00E676); }
      50% { r: 10px; filter: drop-shadow(0 0 8px #00E676); }
      100% { r: 7px; filter: drop-shadow(0 0 2px #00E676); }
    }
    .tesla-flow {
      stroke-dasharray: 6 4 !important;
      animation: teslaFlow 1.8s linear infinite !important;
    }
    .pulse-amber {
      animation: pulseEvidence 2.2s ease-in-out infinite !important;
      transform-origin: center;
    }
    .pulse-emerald {
      animation: pulseEmerald 2s ease-in-out infinite !important;
      transform-origin: center;
    }
    .chiaroscuro-cone {
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .davinci-grid {
      stroke: rgba(235, 238, 242, 0.08) !important;
      stroke-width: 0.6px !important;
    }

    </style>
  </defs>
  <rect width="1200" height="675" class="bg-void" />
  <!-- Da Vinci Vitruvius Geometrisi: Çember ve Kare -->
  <g class="seal-davinci">
    <rect x="360" y="97.5" width="480" height="480" />
    <circle cx="600" cy="337.5" r="240" />
    <circle cx="600" cy="337.5" r="260" stroke="rgba(235, 238, 242, 0.15)" stroke-width="0.75" />
    <!-- Köşegen Denge Hatları -->
    <line x1="360" y1="97.5" x2="840" y2="577.5" stroke="rgba(235, 238, 242, 0.12)" />
    <line x1="840" y1="97.5" x2="360" y2="577.5" stroke="rgba(235, 238, 242, 0.12)" />
  </g>
  <!-- Tesla Enerji Alan Halkası -->
  <circle cx="600" cy="337.5" r="150" class="field-tesla" />
  <!-- Merkez Monogram & Kurucu Mührü -->
  <text x="600" y="325" text-anchor="middle" class="text-serif" font-size="48" font-weight="bold" font-style="italic">
    HP<tspan fill="#E5A93C" font-style="normal">Analytic</tspan>
  </text>
  <!-- Doktrin Beyanı -->
  <text x="600" y="365" text-anchor="middle" class="text-mono" fill="#E5A93C" font-size="14" font-weight="700" letter-spacing="0.25em">
    EVENT ⊂ ZFGV
  </text>
  <text x="600" y="395" text-anchor="middle" class="text-mono" fill="#94A3B8" font-size="10" letter-spacing="0.3em">
    HİKMET PINARBAŞ · FOUNDING AUTHORITY SEAL
  </text>
  <text x="600" y="430" text-anchor="middle" class="text-mono" fill="#3A86C8" font-size="9" letter-spacing="0.2em">
    EVIDENCE BEFORE CONFIDENCE · SPATIOTEMPORAL INTELLIGENCE
  </text>
  <!-- Çevre Bordür Damgaları -->
  <text x="80" y="52" class="text-serif" font-size="18" font-weight="bold">HPANALYTIC · FOUNDER AUTHORITY SEAL</text>
  <text x="80" y="70" class="text-mono" fill="#94A3B8" font-size="10" letter-spacing="0.15em">CANONICAL RESEARCH EMBLEM · CERTIFIED 2026</text>
  <text x="80" y="630" class="text-mono" fill="#94A3B8" font-size="10">FAIL-CLOSED PROTOCOL · THE CLAIM STOPS WHERE THE EVIDENCE STOPS</text>
</svg>