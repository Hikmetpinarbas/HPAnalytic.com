<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>

    <radialGradient id="chiaroscuroBeam" cx="82%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.32" />
      <stop offset="42%" stop-color="#E5A93C" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#121518" stop-opacity="0" />
    </radialGradient>

    <style>
      .bg-void { fill: #121518; }
      .bone-line { stroke: #F8FAFC; stroke-width: 3.5; stroke-linecap: round; }
      .epiphysis-plate { stroke: #BE7A37; stroke-width: 4; stroke-linecap: round; }
      .stress-copper { stroke: #BE7A37; stroke-width: 1.5; stroke-dasharray: 4, 3; }
      .overload-amber { fill: rgba(229, 169, 60, 0.15); stroke: #E5A93C; stroke-width: 1.5; }
      .text-title { font-family: 'Newsreader', serif; fill: #F8FAFC; font-size: 20px; font-weight: 700; }
      .text-meta { font-family: 'IBM Plex Mono', monospace; fill: #94A3B8; font-size: 11px; letter-spacing: 0.15em; }
      .text-copper { font-family: 'IBM Plex Mono', monospace; fill: #BE7A37; font-weight: 700; }
    
    @keyframes teslaFlow {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseEvidence {
      0% { r: 6px; opacity: 0.8; }
      50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 6px #E5A93C); }
      100% { r: 6px; opacity: 0.8; }
    }
    @keyframes pulseEmerald {
      0% { r: 7px; filter: drop-shadow(0 0 2px #00E676); }
      50% { r: 10px; filter: drop-shadow(0 0 8px #00E676); }
      100% { r: 7px; filter: drop-shadow(0 0 2px #00E676); }
    }
    .tesla-flow {
      stroke-dasharray: 6 4 !important;
      animation: teslaFlow 1.8s linear infinite !important;
    }
    .pulse-amber {
      animation: pulseEvidence 2.2s ease-in-out infinite !important;
      transform-origin: center;
    }
    .pulse-emerald {
      animation: pulseEmerald 2s ease-in-out infinite !important;
      transform-origin: center;
    }
    .chiaroscuro-cone {
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .davinci-grid {
      stroke: rgba(235, 238, 242, 0.08) !important;
      stroke-width: 0.6px !important;
    }

    </style>
  </defs>
  <rect width="1200" height="675" class="bg-void" />
  <!-- Da Vinci Gerilim Izgarası -->
  <g stroke="rgba(235, 238, 242, 0.12)" stroke-width="0.75">
    <line x1="160" y1="337" x2="1040" y2="337" />
    <circle cx="380" cy="337" r="140" fill="none" />
    <line x1="380" y1="120" x2="380" y2="550" stroke-dasharray="3, 3" />
  </g>
  <!-- Kemik Anatomisi & Kapanmamış Epifiz Plakları -->
  <line x1="380" y1="160" x2="380" y2="270" class="bone-line" />
  <line x1="380" y1="310" x2="380" y2="480" class="bone-line" />
  <!-- Epifiz Boşluğu ve Yıpranma Hattı (Yanık Bakır) -->
  <line x1="340" y1="290" x2="420" y2="290" class="epiphysis-plate" />
  <circle cx="380" cy="290" r="18" fill="none" stroke="#BE7A37" stroke-dasharray="4, 2" />
  <text x="210" y="295" class="text-copper" font-size="12">Epifiz Kıkırdak Hattı (Açık)</text>
  <!-- 15.000 Dakika Yük Tork Yayları -->
  <path d="M 330,220 Q 380,290 330,360" class=\"stress-copper tesla-flow\" />
  <path d="M 430,220 Q 380,290 430,360" class=\"stress-copper tesla-flow\" />
  <!-- Yorgunluk Analiz Paneli -->
  <rect x="620" y="160" width="440" height="360" fill="#181D22" stroke="#242E38" rx="4" />
  <text x="650" y="205" class="text-title" font-size="16">Akümülatif Hücresel Yük</text>
  <text x="650" y="245" fill="#CBD5E1" font-size="13">Yaş Grubu: U20 (Gelişim Çağı)</text>
  <text x="650" y="280" class="text-copper" font-size="13">Fikstür Yükü: &gt;14.800 Dakika / 2 Sezon</text>
  <text x="650" y="315" fill="#E5A93C" font-family="'IBM Plex Mono', monospace" font-size="12">Kemik Yoğunluğu Mikro-Fraktür Eşiği: 1.82x</text>
  <text x="650" y="350" fill="#94A3B8" font-size="12">Kollajen Sentez Gecikmesi: 72+ Saat</text>
  <text x="650" y="420" fill="#10B981" font-family="'IBM Plex Mono', monospace" font-size="11">Rejenerasyon Penceresi: Yetersiz</text>
  <!-- Başlık -->
  <text x="80" y="52" class="text-title">HPANALYTIC · KEMİK YORGUNLUĞU VE BİYOLOJİK TÜKENİŞ</text>
  <text x="80" y="70" class="text-meta">EPIPHYSEAL STRESS &amp; CHRONIC WORKLOAD ASYMMETRY · ATLAS 08</text>
  <text x="80" y="630" class="text-meta">EVENT ⊂ ZFGV · TENEBRIST CANVAS 1200x675</text>
</svg>