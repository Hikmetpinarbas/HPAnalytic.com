<text x="520" y="105" fill="#d7a84a" font-family="Arial,sans-serif" font-size="26" font-weight="700">5 sn</text>
<text x="885" y="105" fill="#d7a84a" font-family="Arial,sans-serif" font-size="26" font-weight="700">TOP KAZANIMI</text>
<text x="80" y="220" fill="#6d91b8" font-family="Arial,sans-serif" font-size="22">ROTA A · GÖZLENEN</text>
