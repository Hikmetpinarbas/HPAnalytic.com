<circle cx="110" cy="270" r="12" fill="#d7a84a"/><circle cx="420" cy="270" r="12" fill="#d7a84a"/><circle cx="690" cy="270" r="12" fill="#d7a84a"/><circle cx="1040" cy="270" r="12" fill="#d7a84a"/>
<text x="365" y="320" fill="#b9c4cf" font-family="Arial,sans-serif" font-size="20">desteklenen orta aksiyonlar</text>
<text x="80" y="410" fill="#6d91b8" font-family="Arial,sans-serif" font-size="22">ROTA B</text>
<path d="M100 460H300M840 460H1050" stroke="#6d91b8" stroke-width="4"/>
<path d="M300 460H840" stroke="#8798ad" stroke-width="4" stroke-dasharray="14 12"/>
<circle cx="110" cy="460" r="12" fill="#d7a84a"/><circle cx="1040" cy="460" r="12" fill="#d7a84a"/>
<text x="505" y="448" fill="#8798ad" font-family="Arial,sans-serif" font-size="24" font-weight="700">UNKNOWN</text>
