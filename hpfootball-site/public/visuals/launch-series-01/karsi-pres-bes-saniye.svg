<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="counter-title counter-desc" data-truth-role="EXPLANATORY_SCHEMATIC">
<title id="counter-title">Beş saniyelik top kazanımı ile karşı pres mekanizması arasındaki fark</title>
<desc id="counter-desc">İki yol aynı top kaybı ve beş saniye sonra top kazanımı sonucuna ulaşır; bir yolun orta aksiyonları desteklenirken diğer yolun mekanizması bilinmeyen olarak kalır.</desc>
