<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Analistin gölgesi</title><desc id="d">Karanlıkta saha çizgileri ve kanıt ışığına bakan kimliği belirsiz bir analist silueti.</desc><defs><radialGradient id="g" cx="35%" cy="45%" r="60%"><stop offset="0" stop-color="#c98b3c" stop-opacity=".5"/><stop offset=".48" stop-color="#3b2b1b" stop-opacity=".22"/><stop offset="1" stop-color="#070809"/></radialGradient></defs><rect width="1200" height="520" fill="url(#g)"/><g opacity=".5" stroke="#d7b26c" fill="none"><path d="M80 390 L650 210 L1080 360 L510 490 Z"/><path d="M365 300 L795 400"/><ellipse cx="575" cy="350" rx="70" ry="38"/></g><g fill="#050607"><circle cx="960" cy="175" r="48"/><path d="M890 260 Q960 210 1030 260 L1085 500 H835 Z"/></g><path d="M835 240 Q900 205 930 205" stroke="#d6a456" stroke-width="3" opacity=".35"/><text x="78" y="86" fill="#f0b85a" font-family="Arial" font-size="18" letter-spacing="3">ANALİST NOTU</text><text x="78" y="130" fill="#f5f1e8" font-family="Arial" font-size="30" font-weight="700">Verinin sustuğu yerde analist konuşabilir.</text><text x="78" y="168" fill="#c7c7c2" font-family="Arial" font-size="20">Ama önce sustuğu yeri bilmek zorundadır.</text><text x="78" y="465" fill="#777" font-family="Arial" font-size="15">HPANALYTIC · TEMSİLİ EDİTORYAL İLLÜSTRASYON · PORTRE DEĞİLDİR</text></svg>
