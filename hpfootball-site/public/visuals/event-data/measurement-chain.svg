<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Ölçümden iddiaya</title><desc id="d">Gözlemden modele ve yoruma giderken iddia gücünün kontrol edilmesi gerektiğini gösteren kavramsal akış.</desc><rect width="1200" height="675" fill="#0b0d0e"/><text x="70" y="82" fill="#f0b85a" font-family="Arial" font-size="22" letter-spacing="3">ÖLÇÜMDEN İDDİAYA</text><text x="70" y="135" fill="#f5f1e8" font-family="Arial" font-size="42" font-weight="700">Her ok, yeni bir varsayım taşıyabilir.</text><g font-family="Arial" font-size="21" text-anchor="middle"><g fill="#14181a" stroke="#f0b85a" stroke-width="2"><rect x="70" y="260" width="180" height="92" rx="8"/><rect x="305" y="260" width="180" height="92" rx="8"/><rect x="540" y="260" width="180" height="92" rx="8"/><rect x="775" y="260" width="180" height="92" rx="8"/><rect x="1010" y="260" width="120" height="92" rx="8"/></g><g fill="#f5f1e8"><text x="160" y="315">GÖZLEM</text><text x="395" y="315">TÜRETME</text><text x="630" y="315">MODEL</text><text x="865" y="315">YORUM</text><text x="1070" y="315">İDDİA</text></g><g stroke="#80b9d8" stroke-width="3"><path d="M250 306 H295"/><path d="M485 306 H530"/><path d="M720 306 H765"/><path d="M955 306 H1000"/></g><text x="600" y="455" fill="#f0b85a" font-size="28" font-weight="700">İDDİA SINIRI</text><line x1="225" y1="480" x2="975" y2="480" stroke="#f0b85a" stroke-width="3"/><text x="600" y="535" fill="#d7d7d2" font-size="20">Bir sonraki katman, önceki katmanın kanıt kapasitesini kendiliğinden büyütmez.</text><text x="600" y="615" fill="#727a7e" font-size="16">HPANALYTIC · AÇIKLAYICI MODEL · ÖLÇÜLMÜŞ MAÇ VERİSİ DEĞİLDİR</text></g></svg>
