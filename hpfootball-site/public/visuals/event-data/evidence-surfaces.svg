<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Kanıt yüzeyleri</title><desc id="d">Olay verisi, video ve izleme verisinin farklı sorulara açtığı gözlem alanlarını gösteren kavramsal şema.</desc><rect width="1200" height="675" fill="#0b0d0e"/><text x="70" y="82" fill="#f0b85a" font-family="Arial" font-size="22" letter-spacing="3">KANIT YÜZEYLERİ</text><text x="70" y="135" fill="#f5f1e8" font-family="Arial" font-size="42" font-weight="700">Aynı maç. Farklı gözlem kapasitesi.</text><line x1="70" y1="182" x2="1130" y2="182" stroke="#33383b"/><g font-family="Arial"><text x="105" y="255" fill="#f0b85a" font-size="26" font-weight="700">OLAY VERİSİ</text><text x="105" y="302" fill="#d7d7d2" font-size="21">Pas · şut · top kazanımı</text><text x="105" y="338" fill="#d7d7d2" font-size="21">zaman · olay konumu · sonuç</text><text x="465" y="255" fill="#80b9d8" font-size="26" font-weight="700">VİDEO</text><text x="465" y="302" fill="#d7d7d2" font-size="21">Beden yönü · ilişkiler</text><text x="465" y="338" fill="#d7d7d2" font-size="21">görünen topsuz davranış</text><text x="825" y="255" fill="#f0b85a" font-size="26" font-weight="700">İZLEME VERİSİ</text><text x="825" y="302" fill="#d7d7d2" font-size="21">Sürekli konum · mesafe</text><text x="825" y="338" fill="#d7d7d2" font-size="21">hız · mekânsal ilişkiler</text><path d="M105 430 H1080" stroke="#4b5154" stroke-width="3"/><circle cx="190" cy="430" r="14" fill="#f0b85a"/><circle cx="585" cy="430" r="14" fill="#80b9d8"/><circle cx="980" cy="430" r="14" fill="#f0b85a"/><text x="105" y="500" fill="#f5f1e8" font-size="25" font-weight="700">Hiçbiri tek başına “neden?” sorusunu otomatik çözmez.</text><text x="105" y="548" fill="#aeb4b6" font-size="20">Gözlem genişledikçe yorum imkânı artar; iddia sınırı yine kanıt tarafından belirlenir.</text><text x="105" y="615" fill="#727a7e" font-size="16">HPANALYTIC · KAVRAMSAL ŞEMA · GERÇEK MAÇ KOORDİNATI DEĞİLDİR</text></g></svg>
