name: HPAnalytic Linux Acceptance

on:
  pull_request:
    paths:
      - 'hpfootball-site/**'
      - '.github/workflows/hp-football-linux-acceptance.yml'
      - '.github/workflows/hpanalytic-production-deploy.yml'
  workflow_dispatch:

concurrency:
  group: hpanalytic-linux-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: hpfootball-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hpfootball-site/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Astro diagnostics
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Private Studio must not reach production
        run: |
          if grep -rIl -E "src/studio|HP_EDITORIAL_ROOT|/studio/editorial" dist; then
            echo "Editorial Studio code leaked into dist/" >&2
            exit 1
          fi

      - name: Validate generated Cloudflare deployment
        run: npx --yes wrangler@4.146.0 deploy --dry-run --config dist/server/wrangler.json

      - name: Preserve production build for deployment handoff
        uses: actions/upload-artifact@v4
        with:
          name: hpanalytic-production-dist
          path: hpfootball-site/dist
          retention-days: 1
          if-no-files-found: error
