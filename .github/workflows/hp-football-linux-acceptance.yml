name: HPAnalytic Linux Acceptance

on:
  push:
    branches:
      - 'qa/consolidation-20261018'
  pull_request:
    paths:
      - 'hpfootball-site/**'
      - '.github/workflows/hp-football-linux-acceptance.yml'
      - '.github/workflows/hpanalytic-production-deploy.yml'
  workflow_dispatch:

concurrency:
  group: hpanalytic-linux-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: hpfootball-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hpfootball-site/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Astro diagnostics
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Install browser QA runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Physical browser QA
        run: |
          npx --yes wrangler@4.146.0 dev --config dist/server/wrangler.json --local --ip 127.0.0.1 --port 4321 > /tmp/hpanalytic-astro.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/ >/dev/null || { cat /tmp/hpanalytic-astro.log; exit 1; }
          node scripts/worker-http-gate.mjs
          node scripts/public-dist-signatures.mjs dist
          node scripts/release-browser-qa.mjs

      - name: Verify browser QA evidence
        run: |
          test -d qa-artifacts
          find qa-artifacts -type f | grep -q . || { echo "Browser QA evidence missing" >&2; exit 1; }

      - name: Upload browser QA evidence
        if: ${{ (success() || failure()) && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-pack-01-browser-qa
          path: hpfootball-site/qa-artifacts/
          if-no-files-found: warn
          retention-days: 1

      - name: Private Studio must not reach production
        run: |
          if grep -rIl -E "src/studio|HP_EDITORIAL_ROOT|/studio/editorial" dist; then
            echo "Editorial Studio code leaked into dist/" >&2
            exit 1
          fi

      - name: Validate generated Cloudflare deployment
        run: npx --yes wrangler@4.146.0 deploy --dry-run --config dist/server/wrangler.json
