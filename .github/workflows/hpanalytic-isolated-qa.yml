name: HPAnalytic isolated QA (no deploy)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: hpfootball-site
    steps:
      - uses: actions/checkout@v4
      - name: Verify site source
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json || { echo "::error::Missing hpfootball-site/package.json on this branch"; exit 1; }
          test -f package-lock.json || { echo "::error::Missing hpfootball-site/package-lock.json on this branch"; exit 1; }
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hpfootball-site/package-lock.json
      - name: Install, test and build
        run: |
          npm ci
          npm test --if-present
          npm run build
