name: HPAnalytic isolated QA (no deploy)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::warning::Site source is not yet present on this isolated branch. Sync the verified project before running QA."
            exit 0
          fi
          node --version
      - name: Prepare Node
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install, test and build
        if: hashFiles('package-lock.json') != ''
        run: |
          npm ci
          npm test --if-present
          npm run build
