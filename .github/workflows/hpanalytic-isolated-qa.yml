name: HPAnalytic isolated QA (no deploy)
on:
  workflow_dispatch:
  push:
    branches:
      - ops/site-ci-isolated-20261012
permissions:
  contents: read
concurrency:
  group: hpanalytic-isolated-qa
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Repository inspection
        shell: bash
        run: |
          set -euo pipefail
          echo "Commit: $GITHUB_SHA"
          if [ ! -f package.json ]; then
            echo "BLOCKED: package.json not on this branch; site sources not uploaded."
            exit 1
          fi
          node --version
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test --if-present
      - name: Build (no deployment)
        run: npm run build
