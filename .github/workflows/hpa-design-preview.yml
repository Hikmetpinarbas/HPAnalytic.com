name: HPAnalytic Isolated Design Preview
on:
  pull_request:
    branches:
      - site-hp-standard-v2
    paths:
      - 'hpfootball-site/**'
      - '.github/workflows/hpa-design-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-preview:
    if: github.head_ref == 'integration/hpanalytic-canonical-20261019' || github.ref == 'refs/heads/integration/hpanalytic-canonical-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hpfootball-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hpfootball-site/package-lock.json
      - name: Validate before isolated preview
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run check
          npm run build
          test -f dist/server/wrangler.json
          ! grep -rIl -E "src/studio|HP_EDITORIAL_ROOT|/studio/editorial" dist
      - name: Isolate Worker identity and disable custom routes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p='dist/server/wrangler.json';
          const c=JSON.parse(fs.readFileSync(p,'utf8'));
          c.name='hpfootball-design-preview-20261019';
          c.workers_dev=true;
          delete c.route;
          delete c.routes;
          delete c.triggers;
          fs.writeFileSync('dist/server/wrangler.preview.json',JSON.stringify(c,null,2));
          if(c.name==='hpfootball' || c.routes || c.route) process.exit(1);
          console.log('Isolated Worker:',c.name);
          JS
      - name: Deploy to separate Cloudflare preview Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.146.0 deploy --config dist/server/wrangler.preview.json
