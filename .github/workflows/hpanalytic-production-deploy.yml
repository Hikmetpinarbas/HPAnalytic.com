name: HPAnalytic Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Confirm the production release was approved
        type: boolean
        required: true
        default: false

concurrency:
  group: hpanalytic-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/site-hp-standard-v2' && inputs.confirm_production_deploy == true
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: hpfootball-site
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hpfootball-site/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Astro diagnostics
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Install browser QA runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Physical browser QA
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/hpanalytic-astro.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/ >/dev/null || { cat /tmp/hpanalytic-astro.log; exit 1; }
          node scripts/release-browser-qa.mjs

      - name: Upload browser QA evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-pack-01-browser-qa
          path: hpfootball-site/qa-artifacts/
          if-no-files-found: error
          retention-days: 1

      - name: Private Studio must not reach production
        run: |
          if grep -rIl -E "src/studio|HP_EDITORIAL_ROOT|/studio/editorial" dist; then
            echo "Editorial Studio code leaked into dist/" >&2
            exit 1
          fi

      - name: Validate generated Cloudflare deployment
        run: npx --yes wrangler@4.146.0 deploy --dry-run --config dist/server/wrangler.json

      - name: Deploy accepted HPAnalytic to existing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.146.0 deploy --config dist/server/wrangler.json
