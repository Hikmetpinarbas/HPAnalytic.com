name: HPAnalytic Production Deploy

on:
  push:
    branches:
      - site-hp-standard-v2
    paths:
      - 'hpfootball-site/**'
      - '.github/workflows/hpanalytic-production-deploy.yml'
  workflow_dispatch:

concurrency:
  group: hpanalytic-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/site-hp-standard-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: hpfootball-site
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hpfootball-site/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Astro diagnostics
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Private Studio must not reach production
        run: |
          if grep -rIl -E "src/studio|HP_EDITORIAL_ROOT|/studio/editorial" dist; then
            echo "Editorial Studio code leaked into dist/" >&2
            exit 1
          fi

      - name: Deploy accepted HPAnalytic to existing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.146.0 deploy --config wrangler.deploy.jsonc
