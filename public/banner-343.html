<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>343 · HPAnalytic Altyazı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&family=Newsreader:ital,wght@1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #050506; }
  .stage {
    width: 1920px; height: 216px;
    position: relative; overflow: hidden;
    background: #0A0A0C;
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
  }
  .stage::before, .stage::after {
    content: ''; position: absolute; pointer-events: none;
    filter: blur(90px); z-index: 0;
  }
  .stage::before {
    top: -50%; left: 8%; width: 750px; height: 550px;
    background: radial-gradient(circle, rgba(180,255,57,0.18), transparent 68%);
    animation: breathe 6s ease-in-out infinite alternate;
  }
  .stage::after {
    bottom: -55%; right: 12%; width: 850px; height: 550px;
    background: radial-gradient(circle, rgba(255,107,53,0.14), transparent 68%);
    animation: breathe 8s ease-in-out infinite alternate-reverse;
  }
  @keyframes breathe {
    0%   { transform: scale(1); opacity: 0.75; }
    100% { transform: scale(1.15); opacity: 1; }
  }

  /* Dalgalı neon çizgiler */
  .edge { position: absolute; left: 0; right: 0; height: 12px; z-index: 5; }
  .edge-top { top: 0; }
  .edge-bottom { bottom: 0; }
  .edge svg { width: 100%; height: 100%; display: block; }
  .edge-top path {
    fill: none; stroke: #FF6B35; stroke-width: 1.6;
    stroke-linecap: round;
    filter: drop-shadow(0 0 7px rgba(255,107,53,0.9));
    stroke-dasharray: 320 80;
    animation: dashTop 14s linear infinite;
  }
  .edge-bottom path {
    fill: none; stroke: #B4FF39; stroke-width: 1.6;
    stroke-linecap: round;
    filter: drop-shadow(0 0 7px rgba(180,255,57,0.9));
    stroke-dasharray: 320 80;
    animation: dashBottom 14s linear infinite;
  }
  @keyframes dashTop {
    0%   { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 400; }
  }
  @keyframes dashBottom {
    0%   { stroke-dashoffset: 400; }
    100% { stroke-dashoffset: 0; }
  }

  /* Akan şerit */
  .ticker {
    position: absolute; inset: 12px 0 12px 0;
    overflow: hidden; z-index: 2;
    display: flex; align-items: center;
    mask-image: linear-gradient(90deg, transparent 0, #000 60px, #000 calc(100% - 60px), transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 60px, #000 calc(100% - 60px), transparent 100%);
  }
  .track {
    display: flex; align-items: center; gap: 56px;
    white-space: nowrap; padding-left: 0;
    animation: flow 26s linear infinite;
    will-change: transform;
  }
  @keyframes flow {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .item { display: inline-flex; align-items: center; gap: 16px; flex-shrink: 0; }

  /* Logo işareti: mini saha */
  .logo-mark {
    width: 52px; height: 52px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-mark svg { width: 100%; height: 100%; display: block; }

  /* Logo kelime */
  .logo-word {
    font-weight: 800; font-size: 32px;
    letter-spacing: -0.025em;
    line-height: 1;
  }
  .logo-word .hp   { color: #B4FF39; text-shadow: 0 0 14px rgba(180,255,57,0.6); }
  .logo-word .a    { color: #FF6B35; text-shadow: 0 0 10px rgba(255,107,53,0.55); }
  .logo-word .rest { color: #F4F2EC; }

  /* Domain — en büyük öğe */
  .domain {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 46px;
    letter-spacing: -0.01em;
    color: #B4FF39;
    text-shadow: 0 0 22px rgba(180,255,57,0.5);
    line-height: 1;
  }
  .domain .dot { color: #FF6B35; text-shadow: 0 0 14px rgba(255,107,53,0.75); }

  /* Tagline */
  .tagline {
    font-family: 'Newsreader', Georgia, serif;
    font-style: italic; font-size: 30px;
    color: #F4F2EC; opacity: 0.88;
    letter-spacing: -0.005em;
  }

  /* Ayrıcı */
  .sep {
    width: 1px; height: 44px; flex-shrink: 0;
    background: linear-gradient(to bottom, transparent, rgba(180,255,57,0.55), transparent);
  }

  /* Byline — minik, hızlı his */
  .byline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #FF6B35;
    opacity: 0.92;
    display: inline-flex; align-items: center; gap: 10px;
    animation: byPulse 1.6s ease-in-out infinite alternate;
  }
  .byline::before, .byline::after {
    content: ''; width: 14px; height: 1px;
    background: #FF6B35; opacity: 0.7;
  }
  @keyframes byPulse {
    0%   { opacity: 0.7; }
    100% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage::before, .stage::after, .track, .byline,
    .edge-top path, .edge-bottom path { animation: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="edge edge-top">
    <svg viewBox="0 0 1920 12" preserveAspectRatio="none">
      <path d="M0,6 Q240,1 480,6 T960,6 T1440,6 T1920,6"/>
    </svg>
  </div>
  <div class="edge edge-bottom">
    <svg viewBox="0 0 1920 12" preserveAspectRatio="none">
      <path d="M0,6 Q240,11 480,6 T960,6 T1440,6 T1920,6"/>
    </svg>
  </div>

  <div class="ticker">
    <div class="track" id="track"></div>
  </div>
</div>

<script>
  const chunk = `
    <div class="item">
      <div class="logo-mark">
        <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="48" height="48" rx="2" fill="none" stroke="#B4FF39" stroke-width="1.4"/>
          <line x1="26" y1="2" x2="26" y2="50" stroke="#B4FF39" stroke-width="0.8" opacity="0.5"/>
          <circle cx="26" cy="26" r="8" fill="none" stroke="#B4FF39" stroke-width="0.8" opacity="0.5"/>
          <circle cx="26" cy="26" r="2" fill="#FF6B35">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="15" cy="20" r="1.4" fill="#B4FF39" opacity="0.9"/>
          <circle cx="37" cy="32" r="1.4" fill="#B4FF39" opacity="0.9"/>
          <line x1="15" y1="20" x2="26" y2="26" stroke="#B4FF39" stroke-width="0.6" opacity="0.4"/>
          <line x1="26" y1="26" x2="37" y2="32" stroke="#B4FF39" stroke-width="0.6" opacity="0.4"/>
        </svg>
      </div>
      <span class="logo-word"><span class="hp">HP</span><span class="a">A</span><span class="rest">NALYTIC</span></span>
    </div>
    <div class="sep"></div>
    <div class="item">
      <span class="domain">www<span class="dot">.</span>hpanalytic<span class="dot">.</span>com</span>
    </div>
    <div class="sep"></div>
    <div class="item">
      <span class="tagline">Skoru değil, mekanizmayı okuyoruz.</span>
    </div>
    <div class="sep"></div>
    <div class="item">
      <span class="byline">By Hikmet Pınarbaş</span>
    </div>
    <div class="sep"></div>
  `;
  document.getElementById('track').innerHTML = chunk + chunk;
</script>
</body>
</html>
