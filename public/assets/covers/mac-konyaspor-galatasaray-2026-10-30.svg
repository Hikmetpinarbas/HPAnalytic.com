<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#0a0a0c"/>
  <defs>
    <radialGradient id="gk" cx="75%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#gk)"/>

  <!-- Taktik faz göstergesi — 5 daire -->
  <g stroke="#B4FF39" stroke-width="1.5" fill="none" opacity="0.35">
    <circle cx="880" cy="400" r="240"/>
    <circle cx="880" cy="400" r="180"/>
    <circle cx="880" cy="400" r="120"/>
    <circle cx="880" cy="400" r="60"/>
    <!-- Pres haritası noktaları -->
    <line x1="700" y1="400" x2="1060" y2="400"/>
    <line x1="880" y1="220" x2="880" y2="580"/>
  </g>

  <!-- Yüzde 45 savunmada — vurgu -->
