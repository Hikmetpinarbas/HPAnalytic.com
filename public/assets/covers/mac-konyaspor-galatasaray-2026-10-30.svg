  <text x="60" y="100" font-family="monospace" font-size="14" fill="#B4FF39" letter-spacing="6">HPAnalytic · MAÇ DOSYASI</text>
  <line x1="60" y1="120" x2="240" y2="120" stroke="#FF6B35" stroke-width="2"/>

  <!-- Skor -->
