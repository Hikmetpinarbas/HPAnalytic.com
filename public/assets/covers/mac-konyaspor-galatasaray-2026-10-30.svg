  <text x="60" y="570" font-family="Georgia,serif" font-size="64" fill="#FF6B35" font-style="italic">Galatasaray</text>

  <!-- Alt bilgi -->
  <text x="60" y="640" font-family="monospace" font-size="13" fill="#888" letter-spacing="3">SÜPER LİG · 30.10.2026</text>
  <text x="60" y="680" font-family="monospace" font-size="11" fill="#666" letter-spacing="2">4 FAZ · PPDA 4.24 · 19 ŞUT · 1409 PAS</text>
  <text x="60" y="760" font-family="monospace" font-size="12" fill="#888" letter-spacing="4">VERİ: SPORTSBASE</text>
