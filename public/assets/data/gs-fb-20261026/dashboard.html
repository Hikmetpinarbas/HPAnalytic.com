const ROOT=document.getElementById('pitch');
const MAX=5726;
const start=document.getElementById('start'), end=document.getElementById('end');
const label=document.getElementById('windowLabel');
let vegaView=null;
function rowsFor(from,to) {
 const counts=new Map();
 for(const e of DATA.events) {
  if(e.second<from||e.second>to)continue;
  for(const kind of e.types) {
   const key=e.team+'|'+kind;
   counts.set(key,(counts.get(key)||0)+1);
  }
 }
 return [...counts.entries()].map(([key,count])=>({team:key.split('|')[0],category:key.split('|')[1],events:count}));
}
function apply(from,to) {
 const ids=new Set(DATA.events.filter(e=>e.second>=from&&e.second<=to).map(e=>e.key));
 ROOT.querySelectorAll('[data-event]').forEach(el=>{el.style.display=ids.has(el.getAttribute('data-event'))?'':'none'});
 const rows=rowsFor(from,to);
 label.textContent='Saniye '+from+'–'+to+' · '+rows.reduce((n,r)=>n+r.events,0)+' olay etiketi';
 if(vegaView) vegaView.change('windowEvents',vega.changeset().remove(()=>true).insert(rows)).runAsync();
}
const spec={
 '$schema':'https://vega.github.io/schema/vega-lite/v6.json',
 title:'Seçili zaman aralığındaki top kaybı/kazanımı etiketleri',
 data:{name:'windowEvents',values:rowsFor(0,MAX)},
 mark:{type:'bar',tooltip:true},
 encoding:{
  x:{field:'category',type:'nominal',title:'Eylem'},
  y:{field:'events',type:'quantitative',title:'Etiket sayısı'},
  color:{field:'team',type:'nominal',title:'Takım'},
  xOffset:{field:'team'},
  tooltip:[{field:'team'},{field:'category'},{field:'events'}]
 },height:260,width:340
};
vegaEmbed('#stats',spec,{actions:false,renderer:'svg'})
.then(({view})=>{vegaView=view; apply(0,MAX)})
.catch(e=>{document.getElementById('stats').textContent='Grafik yüklenemedi: '+e.message});
function update(){
 let a=Number(start.value),b=Number(end.value);
 if(a>b){if(document.activeElement===start){end.value=String(a);b=a}else{start.value=String(b);a=b}}
 apply(a,b);
}
start.addEventListener('input',update);end.addEventListener('input',update);
document.getElementById('full').addEventListener('click',()=>{start.value=0;end.value=MAX;update()});
document.getElementById('first').addEventListener('click',()=>{start.value=0;end.value=2821;update()});
