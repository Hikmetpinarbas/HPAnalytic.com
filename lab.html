<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Lab — HP//Analytic</title>
<script>(function(){try{var t=localStorage.getItem('hpa-theme');if(!t)t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){}})();</script>
<link rel="stylesheet" href="/src/css/tokens.css">
<link rel="stylesheet" href="/src/css/base.css">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header" id="header">
  <a href="/" class="logo">
    <span class="logo-mark"><svg viewBox="0 0 32 22" width="28" height="19" fill="none"><g stroke="#B4FF39" stroke-width="0.7"><rect x="3" y="2" width="26" height="18"/><line x1="16" y1="2" x2="16" y2="20"/><circle cx="16" cy="11" r="3.5"/></g></svg></span>
    <span class="logo-name"><span class="logo-hp">H</span><span class="logo-hp">P</span><span class="logo-a">A</span><span class="logo-rest">N</span><span class="logo-rest">A</span><span class="logo-rest">L</span><span class="logo-y">Y</span><span class="logo-rest">T</span><span class="logo-rest">I</span><span class="logo-rest">C</span></span>
  </a>
  <nav class="nav-main">
    <a href="/" class="nav-link">Ana Sayfa</a>
    <a href="/super-lig" class="nav-link">Süper Lig</a>
    <a href="/top-5" class="nav-link">Top 5</a>
    <a href="/avrupa" class="nav-link">Avrupa</a>
    <a href="/women" class="nav-link">Kadınlar</a>
    <a href="/lab" class="nav-link" style="color:var(--neon)">Data Lab</a>
  </nav>
  <div class="nav-actions">
    <button class="theme-toggle" id="theme-toggle" aria-label="Tema"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="lang-toggle" id="lang-toggle"><span class="lang-current">TR</span><span class="lang-sep">/</span><span class="lang-other">EN</span></button>
    <button class="mobile-burger" id="mobile-burger" aria-label="Menü"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  </div>
</header>

<main>
  <section class="lab-hero">
    <div class="lab-hero-inner">
      <a href="/" class="lab-back">← Ana sayfa</a>
      <h1 class="lab-h1">Data <em>Lab</em>.</h1>
      <p class="lab-lede">Süper Lig sezonu, 325 oyuncu, 18 takım. Şut haritası, pas ağı, türev metrikler, karşılaştırma.</p>
    </div>
  </section>

  <section class="data-lab lab-page" id="lab">
    <div class="lab-tabs" style="margin-top:0">
      <button class="lab-tab active" data-target="shotmap-container">Şut</button>
      <button class="lab-tab" data-target="passnet-container">Pas</button>
      <button class="lab-tab" data-target="lig-container">Lig</button>
      <button class="lab-tab" data-target="oyuncular-container">Oyuncular</button>
      <button class="lab-tab" data-target="kars-container">Karşılaştır</button>
    </div>
    <div class="lab-stage">
      <div class="lab-panel active" id="shotmap-container">Şut yükleniyor</div>
      <div class="lab-panel" id="passnet-container">Pas yükleniyor</div>
      <div class="lab-panel" id="lig-container">Lig yükleniyor</div>
      <div class="lab-panel" id="oyuncular-container">Oyuncular yükleniyor</div>
      <div class="lab-panel" id="kars-container">Karşılaştırma yükleniyor</div>
    </div>
  </section>
</main>

<script type="module" src="/src/js/lab-main.js"></script>
</body>
</html>
